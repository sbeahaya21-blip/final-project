name: CI Pipeline

on:
  push:
    branches: [ main, master, develop, api_tests ]
  pull_request:
    branches: [ main, master, develop, api_tests ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov pytest-asyncio allure-pytest
    
    - name: Install Playwright browsers
      run: playwright install --with-deps
      continue-on-error: true  # Playwright might not be needed for API tests
    
    - name: Run API tests with coverage
      run: |
        pytest tests/api/ \
          --cov=app \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term \
          --alluredir=allure-results \
          -v || true
      continue-on-error: true
    
    - name: Run UI tests
      run: |
        pytest tests/ui/ -v --alluredir=allure-results || true
      continue-on-error: true  # UI tests might need server running
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        flags: api_tests
        name: codecov-api-tests
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
        # Token is optional for public repositories
      continue-on-error: true
    
    - name: Upload Allure results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-results
        path: allure-results
        retention-days: 30
      continue-on-error: true
