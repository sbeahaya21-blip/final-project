[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# asyncio_mode removed - not needed for TestClient (handles async automatically)
# If you add async tests later, use: pytest_asyncio_mode = auto
addopts = 
    --alluredir=allure-results
    --cov=app
    --cov-report=html
    --cov-report=term
    -v
